<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Clone</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header>
    <img src="images/spotify-logo.png" alt="Spotify Logo" class="logo">
  </header>
  <section class="features">
    <div class="feature">
      <img src="images/music-icon.png" alt="Play your favorites">
      <h3>Play your favorites</h3>
      <p>Listen to millions of songs anywhere and anytime.</p>
    </div>
    <div class="feature">
      <img src="images/high-quality-icon.png" alt="High Quality">
      <h3>High Quality</h3>
      <p>Enjoy the best sound quality with no interruptions.</p>
    </div>
    <div class="feature">
      <img src="images/devices-icon.png" alt="All your devices">
      <h3>All your devices</h3>
      <p>Use Spotify on your phone, tablet, and computer.</p>
    </div>
  </section>
  <footer>
    <p>Spotify Clone - Ironhack Bootcamp</p>
  </footer>

</body>
</html>
